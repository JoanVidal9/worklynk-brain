<title>Núcleo WORKLYNK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#08080a; --text:#edeef5; --text-2:#a4a9bd; --marca:#2bff66;
  --line:rgba(255,255,255,.14); --ease:cubic-bezier(.2,0,0,1);
}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Jost',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.wrap{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}

/* barra superior */
.top{position:relative;z-index:30;display:flex;align-items:center;gap:14px;
  padding:22px clamp(20px,5vw,60px);}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.12em}
.brand svg{width:26px;height:auto}
.brand i{font-style:normal;font-weight:350;color:var(--text-2)}
.brand b{font-weight:700}
.nav{display:flex;gap:26px;margin-left:32px}
.nav a{font-size:12px;letter-spacing:.06em;color:var(--text-2);text-transform:uppercase;transition:color .2s var(--ease)}
.nav a:hover{color:var(--text)}
.spacer{flex:1}
.cta-top{display:inline-flex;align-items:center;gap:8px;background:var(--text);color:#07130c;
  font-size:12px;font-weight:600;letter-spacing:.04em;padding:10px 20px;border-radius:999px;transition:transform .2s var(--ease)}
.cta-top:hover{transform:scale(1.04)}
.cta-top i{width:6px;height:6px;border-radius:50%;background:var(--marca);display:inline-block}
@media(max-width:820px){.nav{display:none}}

/* escenario 3D */
.stage{position:absolute;inset:0;z-index:1;perspective:1400px;pointer-events:none}
.glow{position:absolute;left:58%;top:52%;width:70vmax;height:70vmax;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(230,170,90,.22),rgba(43,255,102,.06) 38%,transparent 66%);
  filter:blur(10px);animation:pulse 6s ease-in-out infinite;will-change:transform,opacity}
@keyframes pulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.art{position:absolute;right:-2%;top:50%;width:min(64vw,880px);transform:translateY(-50%);
  transform-style:preserve-3d;will-change:transform}
.art img{display:block;width:100%;height:auto;border-radius:14px;
  box-shadow:0 40px 120px rgba(0,0,0,.6);animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateZ(0)}50%{transform:translateZ(34px)}}
@media(max-width:820px){
  .art{position:relative;right:auto;top:auto;transform:none;width:92%;margin:8px auto -8px}
  .art img{animation:none}
  .glow{top:34%}
}

/* velo para legibilidad del texto a la izquierda */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,var(--bg) 0%,var(--bg) 26%,rgba(8,8,10,.7) 42%,transparent 66%)}
@media(max-width:820px){.scrim{background:linear-gradient(180deg,transparent 0%,rgba(8,8,10,.6) 46%,var(--bg) 72%)}}

/* contenido */
.hero{position:relative;z-index:10;flex:1;display:flex;align-items:center;
  padding:0 clamp(20px,5vw,60px) 6vh}
.copy{max-width:min(46ch,52vw)}
@media(max-width:820px){.hero{align-items:flex-end}.copy{max-width:none}}
.tag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12px;color:var(--text-2);margin-bottom:22px}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--marca);box-shadow:0 0 8px var(--marca)}
h1{font-size:clamp(2.6rem,7vw,5rem);line-height:.98;letter-spacing:-.03em;font-weight:600;text-transform:uppercase}
.lede{margin-top:22px;font-size:clamp(1rem,1.4vw,1.2rem);line-height:1.6;color:var(--text-2);max-width:40ch;font-weight:300}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 26px;border-radius:999px;
  font-size:15px;font-weight:500;transition:transform .2s var(--ease),background .2s var(--ease)}
.btn--solid{background:var(--text);color:#07130c}
.btn--solid:hover{transform:translateY(-2px)}
.btn--line{border:1px solid var(--line);color:var(--text)}
.btn--line:hover{border-color:var(--text)}

@media(prefers-reduced-motion:reduce){
  .glow,.art img{animation:none}
}
</style>

(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || window.innerWidth < 821) return;
  var art = document.querySelector('.art');
  var tx=0,ty=0,cx=0,cy=0;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth) * 2 - 1;
    ty = (e.clientY / window.innerHeight) * 2 - 1;
  });
  (function loop(){
    requestAnimationFrame(loop);
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    art.style.transform = 'translateY(-50%) rotateY(' + (cx*7) + 'deg) rotateX(' + (-cy*5) + 'deg) translateX(' + (cx*-16) + 'px)';
  })();
})();
</script>
